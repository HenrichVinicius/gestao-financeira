<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão Financeira Pessoal</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="container">
      <h1>Finanças Pessoais</h1>
      <span class="badge">Versão 1.2</span>
    </div>
  </header>

  <main class="container main-content">
    <!-- Resumo de Saldos -->
    <section class="cards-grid">
      <div class="card card-balance">
        <h2>Saldo Atual</h2>
        <p class="card-value" id="total-balance">R$ 0,00</p>
      </div>
      <div class="card card-income">
        <h2>Receitas</h2>
        <p class="card-value" id="total-income">R$ 0,00</p>
      </div>
      <div class="card card-expense">
        <h2>Despesas</h2>
        <p class="card-value" id="total-expense">R$ 0,00</p>
      </div>
    </section>

    <!-- Formulário e Gráfico Lado a Lado no Desktop -->
    <div class="dashboard-split">
      <!-- Formulário de Nova Movimentação -->
      <section class="form-section">
        <h2>Nova Movimentação</h2>
        <form id="transaction-form" class="form-stack">
          <div class="form-group">
            <label for="desc">Descrição</label>
            <input type="text" id="desc" placeholder="Ex: Mercado, Salário..." required />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="amount">Valor (R$)</label>
              <input type="number" id="amount" step="0.01" min="0.01" placeholder="0,00" required />
            </div>

            <div class="form-group">
              <label for="date">Data</label>
              <input type="date" id="date" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="type">Tipo</label>
              <select id="type" required>
                <option value="DESPESA">Despesa</option>
                <option value="RECEITA">Receita</option>
              </select>
            </div>

            <div class="form-group">
              <label for="category">Categoria</label>
              <input type="text" id="category" placeholder="Ex: Alimentação, Lazer..." required />
            </div>
          </div>

          <button type="submit" class="btn-primary full-width">Adicionar Movimentação</button>
        </form>
      </section>

      <!-- Gráfico de Despesas por Categoria -->
      <section class="chart-section">
        <h2>Despesas por Categoria</h2>
        <div class="chart-container">
          <canvas id="expenses-chart"></canvas>
        </div>
        <p id="chart-empty-msg" class="empty-msg" style="display: none;">Nenhuma despesa para exibir no gráfico.</p>
      </section>
    </div>

    <!-- Tabela de Movimentações com Filtros -->
    <section class="transactions-section">
      <div class="section-header-flex">
        <h2>Movimentações Registradas</h2>
        
        <div class="filters-bar">
          <input type="text" id="filter-search" placeholder="Buscar descrição ou categoria..." />
          <select id="filter-type">
            <option value="TODOS">Todos os tipos</option>
            <option value="RECEITA">Apenas Receitas</option>
            <option value="DESPESA">Apenas Despesas</option>
          </select>
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Tipo</th>
              <th class="text-right">Valor</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="transactions-list">
            <!-- Inserido dinamicamente via JS -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/mockData.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
